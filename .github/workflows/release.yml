name: Release

# Push a tag like v1.0.1 (see scripts/release.sh). The full test suite runs
# first; only then is the release published with the .xpi and updates.json.
on:
  push:
    tags: ["v*"]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check tag matches manifest version
        run: |
          v=$(node -p "require('./manifest.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != manifest $v"; exit 1; }
      - run: npm run build
      - run: node scripts/make-updates-json.mjs "$GITHUB_REPOSITORY"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.xpi dist/updates.json \
            --title "Thunderbird Jump $GITHUB_REF_NAME" --generate-notes \
            --notes "Install: download the .xpi below, then in Thunderbird open Add-ons and Themes → ⚙ → Install Add-on From File…  Updates install automatically after that."
