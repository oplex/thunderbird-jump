<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Thunderbird Jump options</title>
  <link rel="stylesheet" href="options.css">
  <script type="module" src="options.js"></script>
</head>
<body>
  <h2>Shortcuts</h2>
  <p class="dim">Set from the palette with <code>:jj1</code> or <code>:jj name</code>; jump with <code>j1</code> or <code>:j name</code>.</p>
  <table>
    <thead><tr><th>Name</th><th>Folder</th><th></th></tr></thead>
    <tbody id="shortcuts"></tbody>
  </table>

  <h2>Behaviour</h2>
  <label><input type="checkbox" id="jumpAfterCreate"> Jump to a folder right after creating it</label>
  <label><input type="checkbox" id="closeOnBlur"> Close the spotlight window when it loses focus</label>
  <label><input type="checkbox" id="revealFolderPane"> Show the folder pane and scroll to the folder when jumping</label>
  <p>
    <button id="clearRecent">Clear recent folders</button>
    <button id="openSpotlight">Open spotlight</button>
  </p>

  <h2>Keyboard shortcuts</h2>
  <p class="dim">
    Click a box and press the new keys (for example <kbd>Ctrl+Alt+J</kbd>).
    <kbd>Backspace</kbd> clears it, <kbd>Esc</kbd> cancels. Give j1–j5 a key to jump
    without opening the palette.
  </p>
  <table>
    <thead><tr><th>Action</th><th>Keys</th><th></th><th></th></tr></thead>
    <tbody id="keyboard"></tbody>
  </table>
</body>
</html>
