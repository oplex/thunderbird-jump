<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ThunderJump</title>
  <link rel="stylesheet" href="palette.css">
  <script type="module" src="palette.js"></script>
</head>
<body>
  <div id="palette">
    <div id="bar">
      <span id="mode" hidden></span>
      <input id="input" type="text" autocomplete="off" spellcheck="false"
             placeholder="Jump to folder…   ? for help">
      <button id="openManager" class="tool" title="ThunderJump Manager: search folders and mail">🔍 Manager <kbd id="managerKey"></kbd></button>
      <button id="openOptions" class="tool" title="Settings, keyboard shortcuts, backup">⚙</button>
    </div>
    <div id="selection" hidden></div>
    <ul id="list" role="listbox"></ul>
    <div id="footer">
      <span id="status"></span>
      <span id="hints">↵ go · ⇧↵ new tab · ⌃N new folder · Alt+1‥9 shortcut · ⌃Z undo · ? help</span>
    </div>
  </div>
</body>
</html>
